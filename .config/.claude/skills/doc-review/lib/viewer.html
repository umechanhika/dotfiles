<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Initial value only: comment.02-render.js retitles the tab to the
       document's own name/heading once it loads (falls back to this on
       failure, so a load error is visible in the tab, not hidden). -->
  <title>doc-review</title>
  <link rel="icon" type="image/svg+xml" href="/lib/favicon.svg">
  <!-- All assets are local. No CDN / external requests. -->
  <!-- comment.css split into cohesive feature files; load order reproduces the
       original cascade exactly (concatenation is byte-identical to the original). -->
  <link rel="stylesheet" href="/lib/comment/01-base.css">
  <link rel="stylesheet" href="/lib/comment/02-markers.css">
  <link rel="stylesheet" href="/lib/comment/03-sidebar.css">
  <link rel="stylesheet" href="/lib/comment/04-controls.css">
  <link rel="stylesheet" href="/lib/comment/05-threads.css">
  <link rel="stylesheet" href="/lib/comment/06-media.css">
  <link rel="stylesheet" href="/lib/comment/07-diff.css">
  <script src="/lib/marked.min.js"></script>
</head>
<body>
  <header id="rd-topbar">
    <div class="rd-topbar-left">
      <span id="rd-filename">…</span>
      <span id="rd-status" class="rd-status">読み込み中…</span>
    </div>
    <div class="rd-topbar-right">
      <span id="rd-diff-note" class="rd-hint" hidden></span>
      <!-- Markdown only (HTML renders in an iframe — see comment.00-core.js
           isHtml()); comment.09-diffview.js hides this entirely for HTML and
           disables it until the first /threads/submit produces a baseline. -->
      <button id="rd-diff-toggle" class="rd-btn rd-btn-ghost" type="button" hidden disabled>変更点を表示</button>
      <button id="rd-sidebar-toggle" class="rd-icon-btn" type="button"
              aria-label="コメントパネルの開閉" aria-expanded="true" title="コメントパネルの開閉">☰</button>
    </div>
  </header>

  <main id="rd-main">
    <!-- markdown renders into #rd-content; HTML renders into the iframe so the
         target's own <head> CSS applies in an isolated document. Exactly one is
         visible at a time (toggled in comment.js render()). The iframe is
         sandboxed WITHOUT allow-scripts: the target's CSS/static look is faithful
         but its <script>s do not run (they could fight our marker injection). -->
    <article id="rd-content" aria-label="プレビュー"></article>
    <iframe id="rd-frame" title="プレビュー" sandbox="allow-same-origin" hidden></iframe>
  </main>

  <aside id="rd-sidebar" aria-label="コメントパネル">
    <div id="rd-resize-handle" class="rd-resize-handle" title="ドラッグで幅を変更" aria-hidden="true"></div>
    <div class="rd-sidebar-head">
      <h2>コメント <span id="rd-count" class="rd-badge">0</span></h2>
    </div>
    <div id="rd-list" class="rd-list"></div>
    <div class="rd-sidebar-foot">
      <button id="rd-send" class="rd-btn rd-btn-primary" disabled>Claude に送信</button>
      <p id="rd-send-note" class="rd-send-note"></p>
    </div>
  </aside>

  <!-- Comment input popover -->
  <div id="rd-popover" class="rd-popover" hidden>
    <div class="rd-popover-target" id="rd-popover-target"></div>
    <textarea id="rd-popover-text" rows="3" placeholder="コメントを入力…"></textarea>
    <div class="rd-popover-actions">
      <button id="rd-popover-cancel" class="rd-btn rd-btn-ghost">キャンセル</button>
      <button id="rd-popover-add" class="rd-btn rd-btn-primary">追加</button>
    </div>
  </div>

  <div id="rd-toast" class="rd-toast"></div>

  <!-- Visually hidden live region: announces Claude's updates to assistive tech. -->
  <div id="rd-live" class="rd-sr-only" aria-live="polite" role="status"></div>

  <!-- comment.js split into cohesive ordered classic scripts (un-wrapped IIFE);
       concatenation in load order reproduces the original body byte-for-byte.
       The last segment defines window.ReviewDoc = { start }. -->
  <script src="/lib/comment/comment.00-core.js"></script>
  <script src="/lib/comment/comment.01-bootstrap.js"></script>
  <script src="/lib/comment/comment.02-render.js"></script>
  <script src="/lib/comment/comment.03-selection.js"></script>
  <script src="/lib/comment/comment.04-sidebar.js"></script>
  <script src="/lib/comment/comment.05-markers.js"></script>
  <script src="/lib/comment/comment.06-server.js"></script>
  <script src="/lib/comment/comment.07-utils.js"></script>
  <script src="/lib/comment/comment.08-diff.js"></script>
  <script src="/lib/comment/comment.09-diffview.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      ReviewDoc.start();
    });
  </script>
</body>
</html>
